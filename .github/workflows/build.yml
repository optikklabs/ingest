name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11
      - run: go test -race ./...
      - run: go build ./cmd/ingest

  # Reachable vulnerabilities in dependencies and the standard library. A
  # separate job so an advisory awaiting an upstream release is visible
  # without masking lint and test results.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
