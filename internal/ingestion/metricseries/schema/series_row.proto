syntax = "proto3";

package optikk.ingest.metricseries.v1;

option go_package = "github.com/optikklabs/ingest/internal/ingestion/metricseries/schema;schema";

                                                                               
                                                                               
                                                                            
message SeriesRow {
  uint32 tenant_id = 1;
  uint64 fingerprint = 2;
  int64  timestamp_ns = 3;
  string metric_name = 4;
  string metric_type = 5;
  string temporality = 6;
  bool   is_monotonic = 7;
  string unit = 8;
  string description = 9;
  string service = 10;
  string host = 11;
  string environment = 12;
  string k8s_namespace = 13;
  string pod = 14;
  string container = 15;
  map<string, string> attributes = 16;
                                                                 
                                                                    
  map<string, string> resource_attributes = 17;
}
