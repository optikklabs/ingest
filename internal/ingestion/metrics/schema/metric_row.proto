syntax = "proto3";

package optikk.ingest.metrics.v1;

option go_package = "github.com/optikklabs/ingest/internal/ingestion/metrics/schema;schema";

                                                                                 
                                                                                 
                                                                         
message Row {
  uint32 tenant_id = 1;
  string metric_name = 2;
  string temporality = 4;
  uint64 fingerprint = 8;
  int64  timestamp_ns = 9;
  double value = 10;
  double hist_sum = 11;
  uint64 hist_count = 12;
  repeated double hist_buckets = 13;
  repeated uint64 hist_counts  = 14;
  repeated double summary_quantiles = 15;
  repeated double summary_values    = 16;

  // Series dimensions, so the rollup MVs need no metrics_series join.
  string service = 28;
  string host = 29;
  string pod = 30;
  string container = 31;
  string k8s_namespace = 32;
  string environment = 33;

  // Datapoint attributes verbatim, so arbitrary-label group-by keeps working.
  map<string, string> attributes = 34;

  string cloud_provider = 41;   // cloud.provider
  string cloud_account = 42;    // cloud.account.id
  string cloud_region = 43;     // cloud.region, else aws.region
  string cloud_platform = 44;   // cloud.platform
  string k8s_node = 45;         // k8s.node.name

  // Numbers stay reserved: in-flight messages may still carry the old types.
  reserved 3, 5, 6, 7, 17, 20, 21, 22, 23, 24, 25, 26, 27;
  reserved "metric_type", "is_monotonic", "unit", "description", "resource",
           "ts_bucket_hour_seconds", "http_method", "http_status_code";
}
