syntax = "proto3";

package optikk.ingest.spans.v1;

option go_package = "github.com/optikklabs/ingest/internal/ingestion/spans/schema;schema";

// Row is the wire format on Kafka. One record == one span row bound for observability.spans.
message Row {
  uint64 ts_bucket = 1;
  uint32 tenant_id = 2;
  int64  timestamp_ns = 3;
  string trace_id = 4;
  string span_id = 5;
  string parent_span_id = 6;
  string trace_state = 7;
  uint32 flags = 8;
  string name = 9;
  int32  kind = 10;              
  string kind_string = 11;
  uint64 duration_nano = 12;
  bool   has_error = 13;
  reserved 14;                   
  reserved "is_remote";
  int32  status_code = 15;       
  string status_code_string = 16;
  string status_message = 17;
  string http_url = 18;
  string http_method = 19;
  string http_host = 20;
  reserved 21, 22;               
  reserved "external_http_url", "external_http_method";
  string response_status_code = 23;
  message SpanEvent {
    string name = 1;
    uint64 time_unix_nano = 2;
    map<string, string> attributes = 3;
  }
  message SpanLink {
    string trace_id = 1;
    string span_id = 2;
    string trace_state = 3;
    map<string, string> attributes = 4;
  }

  map<string, string> attributes = 24;
  repeated SpanEvent events = 25;
  repeated SpanLink links = 26;
  string exception_type = 27;
  string exception_message = 28;
  string exception_stacktrace = 29;
  bool   exception_escaped = 30;
  reserved 31;
  reserved "fingerprint";
  
  string service = 32;
  string host = 33;
  string pod = 34;
  string service_version = 35;
  string environment = 36;
  string peer_service = 37;
  string db_system = 38;
  string db_name = 39;
  string db_statement = 40;
  string http_route = 41;
  // Unused since http_status_bucket became a MATERIALIZED CH column; kept so
  // in-flight Kafka messages from older producers still decode.
  string http_status_bucket = 42;

  string gen_ai_system = 43;
  string gen_ai_operation = 44;
  string gen_ai_request_model = 45;
  string gen_ai_response_model = 46;
  uint64 gen_ai_input_tokens = 47;
  uint64 gen_ai_output_tokens = 48;
  bool   is_gen_ai = 49;
  string gen_ai_prompt = 50;
  string gen_ai_completion = 51;

  // LLM Observability context promoted from gen_ai / langfuse attributes.
  string          llm_user_id = 52;
  string          llm_session_id = 53;
  repeated string llm_tags = 54;
  string          llm_release = 55;
  string          llm_prompt_name = 56;
  uint32          llm_prompt_version = 57;
  string          gen_ai_span_kind = 58;
}
