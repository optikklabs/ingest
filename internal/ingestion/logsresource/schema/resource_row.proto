syntax = "proto3";

package optikk.ingest.logsresource.v1;

option go_package = "github.com/optikklabs/ingest/internal/ingestion/logsresource/schema;schema";

// ResourceRow is the wire format on Kafka for logs resource metadata.
// One record == one unique resource fingerprint bound for optikk.logs_resource.
message ResourceRow {
  uint32 tenant_id     = 1;
  uint64 fingerprint = 2;
  string service     = 3;
  string host        = 4;
  string pod         = 5;
  string environment = 6;
  string container   = 7;
  uint32 ts_bucket   = 8;
}
