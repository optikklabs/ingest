environment: development

# HTTP listener for /metrics and /health only (no query API).
server:
  port: "18090"

mysql:
  host: "127.0.0.1"
  port: "13306"
  database: optikk
  user: root
  password: "" # Use OPTIKK_MYSQL_PASSWORD environment variable
  max_open_conns: 10
  max_idle_conns: 5

clickhouse:
  host: "127.0.0.1"
  port: "19000"
  database: optikk
  user: default
  password: "" # Use OPTIKK_CLICKHOUSE_PASSWORD environment variable
  secure: false
  # Insert pool; batched writes need few connections. 0 falls back to 20/10.
  max_open_conns: 20
  max_idle_conns: 10

otlp:
  grpc_port: "18317"

ingestion:
  spans:
    partitions: 8
    replicas: 1
    retention_hours: 24
  spans_tracegraph:
    partitions: 8
    replicas: 1
    retention_hours: 24
  logs:
    partitions: 8
    replicas: 1
    retention_hours: 24
  metrics:
    partitions: 8
    replicas: 1
    retention_hours: 24
  metric_series:
    partitions: 8
    replicas: 1
    retention_hours: 24
  spans_resource:
    partitions: 8
    replicas: 1
    retention_hours: 24
  logs_resource:
    partitions: 8
    replicas: 1
    retention_hours: 24

kafka:
  broker_list: "127.0.0.1:9092"
  topic_prefix: optikk.ingest
  dlq_prefix: optikk.dlq
  compression: zstd
  linger_ms: 20
  batch_max_bytes: 1048576
  # CH insert retries before a batch falls back to the DLQ (default 2)
  consumer_max_retries: 2
  # One Kafka poll maps directly to one ClickHouse insert batch.
  consumer_max_poll_records: 5000
