environment: development

                                                             
server:
  port: "18090"

mysql:
  host: "127.0.0.1"
  port: "13306"
  database: optikk
  user: root
  password: "localdev"                                                            
  max_open_conns: 10
  max_idle_conns: 5

clickhouse:
  host: "127.0.0.1"
  port: "19000"
  database: optikk
  user: default
  password: "localdev"                                                                 
  secure: false                                      
  max_open_conns: 30
  max_idle_conns: 10

otlp:
  grpc_port: "18317"
  http_port: "18318"

ingestion:
  spans:
    partitions: 32
    replicas: 1
    retention_hours: 24
  logs:
    partitions: 32
    replicas: 1
    retention_hours: 24
  metrics:
    partitions: 32
    replicas: 1
    retention_hours: 24
  metric_series:
    partitions: 32
    replicas: 1
    retention_hours: 24
  ingestion_stats:
    partitions: 32
    replicas: 1
    retention_hours: 24                                    
  side_publish:
    queue_size: 4096
    workers: 2
                                     
  series_dedup_size: 500000                                        
  api_key_cache_ttl_seconds: 30                                                         
  api_key_cache_size: 50000

kafka:
  broker_list: "127.0.0.1:9092"
  topic_prefix: optikk.ingest
  dlq_prefix: optikk.dlq
  compression: zstd
  linger_ms: 20
  batch_max_bytes: 1048576
  fetch_max_bytes: 52428800
  fetch_max_partition_bytes: 8388608
  consumer_max_poll_records: 50000                                                            
  consumer_insert_workers: 4
