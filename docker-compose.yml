services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: optikk
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: localdev
    ports:
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./db/config.d/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./db/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./db/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./db/config.d/merge_tree.xml:/etc/clickhouse-server/config.d/merge_tree.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: localdev
      MARIADB_DATABASE: optikk
    ports:
      - "13306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  clickhouse_data:
  mariadb_data:
  kafka_data:
