services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_DB: optikk
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: localdev
    ports:
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./db/config.d/macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./db/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./db/config.d/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./db/config.d/merge_tree.xml:/etc/clickhouse-server/config.d/merge_tree.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: localdev
      MARIADB_DATABASE: optikk
    ports:
      - "13306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

                                                                         
                                                                      
                                             
  kafka:
    image: ghcr.io/ramantayal12/mq:latest
    environment:
      KAFKA_LISTENERS: "0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "localhost:9092"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_AUTO_CREATE_TOPICS: "true"
      KAFKA_DATA_DIR: "/var/lib/mq"
    ports:
      - "9092:9092"
    volumes:
      - mq_data:/var/lib/mq
  
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: optikk-prometheus
    restart: unless-stopped
    ports:
      - "19091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"


volumes:
  clickhouse_data:
  mariadb_data:
  mq_data:
  prometheus-data:
